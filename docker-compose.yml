services:
  db:
    image: postgres:15-alpine
    container_name: flaskdb-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE_NAME:-flask-db-app}:latest
    build: .
    container_name: flaskdb-app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: